# CRC 2.2 fixed approved/backup targeted-drug table.
# These rows are displayed in the "其它潜在获益上市药物提示" section.
crc_approved_drugs:
  - drug:
      - "瑞戈非尼"
      - "Regorafenib"
      - "[拜万戈]"
    gene: "RET、VEGFR1、VEGFR2、VEGFR3、KIT、PDGFRα、PDGFRβ、FGFR1、FGFR2、TIE2、DDR2、TrkA、EphA2、RAF1、BRAF、BRAF V600E、SAPK2、PTK5、ABL"
    indication: "FDA和NMPA批准用于治疗结直肠癌、胃肠道间质瘤和肝癌。2022年结肠癌和直肠癌NCCN指南推荐瑞戈非尼为在所有可用方案进展的结直肠癌患者的治疗方案。2022年CSCO指南推荐瑞戈非尼作为化疗，或抗VEGF和抗EGFR靶向药物等现有标准治疗失败后的三线用药。"
  - drug:
      - "贝伐珠单抗"
      - "Bevacizumab"
      - "[安维汀]"
    gene: "VEGF"
    indication: "FDA批准用于治疗转移性结直肠癌、非鳞状非小细胞肺癌、胶质母细胞瘤、转移性肾细胞癌、宫颈癌、卵巢上皮癌、输卵管癌、原发性腹膜癌和肝细胞癌。NMPA批准用于治疗转移性结直肠癌、非鳞状非小细胞肺癌、胶质母细胞瘤、肝细胞癌、卵巢上皮癌、输卵管癌、原发性腹膜癌和宫颈癌。2022年结肠癌和直肠癌NCCN指南推荐多种化疗方案（FOLFIRI、FOLFOX、CAPEOX或FOLFOXIRI）联合贝伐珠单抗用于治疗结肠癌和直肠癌患者，TAS-102±贝伐珠单抗适用于接受过任意治疗方案进展的晚期结肠癌和直肠癌患者。2022年CSCO指南亦推荐多种化疗方案联合贝伐珠单抗用于治疗结肠癌和直肠癌患者。"
  - drug:
      - "雷莫西尤单抗"
      - "Ramucirumab"
      - "[希冉择]"
    gene: "VEGFR2"
    indication: "FDA批准用于治疗胃癌或胃食管交界处腺癌、非小细胞肺癌、结直肠癌、肝细胞癌。NMPA批准用于治疗胃癌或胃食管交界处腺癌。2022年结肠癌和直肠癌NCCN指南推荐FOLFIRI方案联合雷莫西尤单抗用于治疗结肠癌和直肠癌患者。"
  - drug:
      - "呋喹替尼"
      - "Fruquintinib"
      - "[爱优特]"
    gene: "VEGFR1、VEGFR2、VEGFR3"
    indication: "NMPA批准用于治疗既往接受过氟尿嘧啶类、奥沙利铂和伊立替康为基础的化疗，以及既往接受过或不适合接受抗血管内皮生长因子（VEGF）治疗、抗表皮生长因子受体（EGFR）治疗（RAS野生型）的转移性结直肠癌患者。2022年CSCO指南推荐呋喹替尼用于治疗标准治疗失败后的结肠癌和直肠癌患者。"
  - drug:
      - "阿柏西普"
      - "Ziv-aflibercept"
      - "[ZALTRAP]"
    gene: "VEGF-A、VEGF-B、PIGF"
    indication: "FDA批准阿柏西普联合5-氟尿嘧啶、亚叶酸钙、伊立替康（FOLFIRI）用于治疗奥沙利铂治疗后耐药或疾病进展的转移性结直肠癌（mCRC）患者。2022年结肠癌和直肠癌NCCN指南推荐阿柏西普联合化疗用于治疗结肠癌和直肠癌患者。"
  - drug:
      - "阿帕替尼"
      - "Apatinib"
      - "[艾坦]"
    gene: "VEGFR2"
    indication: "NMPA批准用于治疗胃腺癌或胃食管交界处腺癌、肝细胞癌。目前在国内的临床实践中，有将阿帕替尼应用于治疗结直肠癌患者的案例，并从中观察到比较好的疗效。"
  - drug:
      - "盐酸安罗替尼"
      - "Anlotinib Hydrochloride"
      - "[福可维]"
    gene: "VEGFR1、VEGFR2、VEGFR3、c-KIT、PDGFR-β"
    indication: "NMPA批准用于治疗小细胞肺癌、腺泡状软组织肉瘤、透明细胞肉瘤以及既往至少接受过含蒽环类化疗方案治疗后进展或复发的其它晚期软组织肉瘤、放射性碘难治性分化型甲状腺癌、甲状腺髓样癌、非小细胞肺癌。目前有将安罗替尼用于治疗结直肠癌患者的临床试验，正在招募患者。"
